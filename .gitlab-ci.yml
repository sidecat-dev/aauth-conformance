stages: [verify]

linux:
  stage: verify
  image: golang:1.25
  parallel:
    matrix:
      - RUNNER: saas-linux-small-amd64
        TARGET: linux-amd64
      - RUNNER: saas-linux-small-arm64
        TARGET: linux-arm64
  tags: [$RUNNER]
  script:
    - test -z "$(gofmt -l cmd internal adapters/go)"
    - go vet ./...
    - go test -race ./...
    - mkdir -p build
    - CGO_ENABLED=0 go build -trimpath -o "build/aauth-conformance-${TARGET}" ./cmd/aauth-conformance
    - cp "$(go env GOROOT)/LICENSE" build/GO-LICENSE
  artifacts:
    name: "aauth-conformance-${TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/aauth-conformance-*
      - build/GO-LICENSE
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - README.md
      - FORMAT.md
      - ADAPTERS.md
      - fixture.json
      - clauses.json
      - scenarios/
      - reports/
    expire_in: 14 days
