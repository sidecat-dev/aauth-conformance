[package]
name = "aauth-protocol-deployment"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The two crates under test, at the versions measured; see README.md. Their
# default features pull in reqwest, which this deployment replaces with its
# own client so that names route to loopback.
[dependencies]
aauth-protocol = { version = "=0.2.0", default-features = false }
aauth-person-server = { version = "=0.1.0", default-features = false }
async-trait = "0.1"
bytes = "1"
http = "1"
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
