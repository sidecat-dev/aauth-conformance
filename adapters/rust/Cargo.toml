[package]
name = "aauth-conformance-rust-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
federation = []
deferred = ["federation"]
subagent = ["deferred"]
events = []
r3 = []

[dependencies]
aauth-rust-jose = "=0.1.0-alpha.2"
aauth-rust-budgets = "=0.1.0-alpha.2"
aauth-rust-agent = "=0.1.0-alpha.2"
aauth-rust-core = "=0.1.0-alpha.2"
aauth-rust-resource = "=0.1.0-alpha.2"
aauth-rust-person-server = "=0.1.0-alpha.2"
http = "1"
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "=0.12.0"
